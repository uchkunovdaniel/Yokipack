<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
    <title>Hakobi, the Yōkify mascot</title>
    <style>
        .shadow { fill: rgba(29, 33, 32, .14); }
        .bob { animation: bob 2.2s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate; }
        .eyes { transform-box: fill-box; transform-origin: center; animation: blink 7s linear infinite; }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
        @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
        @media (prefers-reduced-motion: reduce) { .bob, .eyes { animation: none; } }
    </style>
    <ellipse class="shadow" cx="100" cy="184" rx="58" ry="6"/>
    <g class="bob">
        <!-- tail -->
        <ellipse cx="146" cy="156" rx="17" ry="26" transform="rotate(40 146 156)" fill="#8A5A3B"/>
        <ellipse cx="160" cy="142" rx="10" ry="11" transform="rotate(40 160 142)" fill="#3A2A22"/>
        <!-- feet, body, belly, arms -->
        <ellipse cx="80" cy="176" rx="15" ry="8" fill="#3A2A22"/>
        <ellipse cx="120" cy="176" rx="15" ry="8" fill="#3A2A22"/>
        <rect x="58" y="102" width="84" height="76" rx="34" fill="#8A5A3B"/>
        <ellipse cx="100" cy="148" rx="25" ry="23" fill="#F3E9D2"/>
        <ellipse cx="64" cy="134" rx="10" ry="19" transform="rotate(14 64 134)" fill="#8A5A3B"/>
        <ellipse cx="136" cy="134" rx="10" ry="19" transform="rotate(-14 136 134)" fill="#8A5A3B"/>
        <!-- ears, head, mask, muzzle -->
        <ellipse cx="64" cy="50" rx="15" ry="17" fill="#8A5A3B"/>
        <ellipse cx="64" cy="53" rx="7" ry="9" fill="#3A2A22"/>
        <ellipse cx="136" cy="50" rx="15" ry="17" fill="#8A5A3B"/>
        <ellipse cx="136" cy="53" rx="7" ry="9" fill="#3A2A22"/>
        <rect x="44" y="42" width="112" height="78" rx="38" fill="#8A5A3B"/>
        <ellipse cx="77" cy="86" rx="17" ry="12" transform="rotate(-20 77 86)" fill="#5A3A29"/>
        <ellipse cx="123" cy="86" rx="17" ry="12" transform="rotate(20 123 86)" fill="#5A3A29"/>
        <ellipse cx="100" cy="103" rx="18" ry="12.5" fill="#F3E9D2"/>
        <ellipse cx="100" cy="95" rx="6" ry="4.2" fill="#3A2A22"/>
        <path d="M95.5 104.5 q4.5 3.5 9 0" fill="none" stroke="#3A2A22" stroke-width="3" stroke-linecap="round"/>
        <g class="eyes">
            <rect x="77" y="76" width="6.5" height="13" rx="3.25" fill="#1C130E"/>
            <rect x="116.5" y="76" width="6.5" height="13" rx="3.25" fill="#1C130E"/>
        </g>
        <!-- Nozoki, held -->
        <g transform="translate(54 100) scale(.46)">
            <rect x="54" y="136" width="104" height="40" rx="14" fill="#1F6F78"/>
            <ellipse cx="108" cy="70" rx="17" ry="10" fill="#F3E9D2"/>
            <circle cx="134" cy="66" r="8" fill="#C8102E"/>
            <path d="M70 72 l5 -11 l6 7 l6 -10 l6 14 z" fill="#6E8B3D"/>
            <rect x="46" y="68" width="104" height="38" rx="14" fill="#1F6F78"/>
            <rect x="88" y="83" width="20" height="5" rx="2.5" fill="#185A62"/>
            <rect x="38" y="100" width="116" height="42" rx="16" fill="#F3E9D2"/>
            <g class="eyes">
                <rect x="77" y="111" width="8" height="17" rx="4" fill="#185A62"/>
                <rect x="107" y="111" width="8" height="17" rx="4" fill="#185A62"/>
            </g>
            <g transform="rotate(-11 52 72)">
                <rect x="50" y="50" width="112" height="22" rx="11" fill="#185A62"/>
                <rect x="97" y="41" width="18" height="12" rx="6" fill="#185A62"/>
            </g>
        </g>
        <!-- paws over the box -->
        <ellipse cx="73" cy="150" rx="8" ry="7" fill="#8A5A3B"/>
        <ellipse cx="127" cy="150" rx="8" ry="7" fill="#8A5A3B"/>
    </g>
</svg>