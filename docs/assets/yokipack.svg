<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
    <title>Nozoki, the Yōkipack mascot</title>
    <style>
        .shadow { fill: rgba(29, 33, 32, .14); }
        .bob { animation: bob 2.2s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate; }
        .eyes { transform-box: fill-box; transform-origin: center; animation: blink 7s linear infinite; }
        @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
        @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
        @media (prefers-reduced-motion: reduce) { .bob, .eyes { animation: none; } }
    </style>
    <ellipse class="shadow" cx="102" cy="182" rx="54" ry="6"/>
    <g class="bob">
        <rect x="54" y="136" width="104" height="40" rx="14" fill="#1F6F78"/>
        <ellipse cx="108" cy="70" rx="17" ry="10" fill="#F3E9D2"/>
        <circle cx="134" cy="66" r="8" fill="#C8102E"/>
        <path d="M70 72 l5 -11 l6 7 l6 -10 l6 14 z" fill="#6E8B3D"/>
        <rect x="46" y="68" width="104" height="38" rx="14" fill="#1F6F78"/>
        <rect x="88" y="83" width="20" height="5" rx="2.5" fill="#185A62"/>
        <rect x="38" y="100" width="116" height="42" rx="16" fill="#F3E9D2"/>
        <g class="eyes">
            <rect x="77" y="111" width="8" height="17" rx="4" fill="#185A62"/>
            <rect x="107" y="111" width="8" height="17" rx="4" fill="#185A62"/>
        </g>
        <g transform="rotate(-11 52 72)">
            <rect x="50" y="50" width="112" height="22" rx="11" fill="#185A62"/>
            <rect x="97" y="41" width="18" height="12" rx="6" fill="#185A62"/>
        </g>
    </g>
</svg>